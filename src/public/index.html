<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbershop - Reserva Rápida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/jpeg" href="/assets/logo-barberia.jpg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="overlay"></div>

    <div class="form-container">
      <img src="/assets/logo-barberia.jpg" alt="Logo Barbería" class="logo" />
      <h2>Barbershop Reserva Rápida</h2>
      <p class="sub">Agenda tu cita en minutos</p>
      <form id="reservaForm">
        <input type="text" id="nombre" placeholder="Nombre completo" required />
        <input type="tel" id="telefono" placeholder="Teléfono" required />
        <input type="email" id="correo" placeholder="Correo electrónico" required />
        <select id="servicio" name="servicio" required>
          <option value="">-- Selecciona un servicio --</option>
        </select>
        <input type="datetime-local" id="fechaHora" required />
        <small>Lun–Sáb, 9:00 a.m. – 8:00 p.m. (hora Perú)</small>
        <div id="status" class="status-msg"></div>
        <button type="submit" class="btn-reserva">Crear reserva</button>
      </form>
    </div>

    <div class="reservations-section">
      <div class="reservations-header">
        <div>
          <h3>Reservas</h3>
          <p class="sub">Consulta el estado de cada turno</p>
        </div>
        <div class="reservations-actions">
          <button id="downloadCsvButton" type="button" class="btn-outline" style="display:none">Descargar CSV</button>
          <button id="adminButton" type="button" class="btn-outline primary">Ingresar como administrador</button>
        </div>
      </div>
      <div class="reservations-table-wrap">
        <div id="reservationsList"></div>
      </div>
    </div>

    <div id="loginModal" class="modal-overlay">
      <form id="loginForm" class="modal-box">
        <h3>Acceso administrador</h3>
        <p class="sub">Ingresa tus credenciales para gestionar las reservas.</p>
        <label>
          <span>Usuario</span>
          <input type="text" id="username" placeholder="admin" required />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" id="password" placeholder="••••••••" required />
        </label>
        <div class="modal-actions">
          <button type="button" id="loginCancel" class="btn-modal secondary">Cancelar</button>
          <button type="submit" class="btn-modal primary">Ingresar</button>
        </div>
        <p id="loginError" class="error-msg"></p>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
